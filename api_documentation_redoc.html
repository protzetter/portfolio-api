        const spec = {"openapi": "3.1.0", "info": {"title": "Portfolio Management API", "description": "\n# Portfolio Management System\n\nA comprehensive API for managing investment portfolios across multiple asset classes,\nincluding traditional securities and alternative assets.\n\n## Core Features\n\n- **Multi-Portfolio Management**: Track multiple portfolios per user\n- **Investor Profiling**: Privacy-first suitability assessment system\n- **Holdings Tracking**: Traditional securities and alternative assets\n- **Transaction Recording**: Complete buy/sell history with FX tracking\n- **Performance Analytics**: Returns calculation and attribution analysis\n- **Risk Analytics**: Portfolio risk metrics and compliance monitoring\n- **Multi-Currency Support**: FX impact attribution and currency conversion\n\n## Authentication\n\nCurrently using placeholder authentication. In production, all endpoints will require\nJWT bearer token authentication.\n\n## Rate Limiting\n\nNo rate limiting currently implemented. Production deployment will include rate limiting\nto prevent abuse.\n\n## Support\n\nFor API support, please contact the development team.\n    ", "contact": {"name": "Portfolio Management API Support", "email": "support@example.com"}, "license": {"name": "Proprietary"}, "version": "1.0.0"}, "paths": {"/api/portfolios": {"post": {"tags": ["portfolios"], "summary": "Create Portfolio", "description": "Create a new portfolio.\n\nRequirements: 1.1, 10.1", "operationId": "create_portfolio_api_portfolios_post", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PortfolioCreate"}}}}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PortfolioResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "get": {"tags": ["portfolios"], "s TTPValidationError"}}}}}}}, "/api/portfolios/{portfolio_id}/transactions": {"post": {"tags": ["transactions"], "summary": "Record Transaction", "description": "Record a buy or sell transaction.\n\nThis endpoint processes transactions by:\n- For BUY: Creating or updating holdings\n- For SELL: Validating and reducing holdings\n- Recording the transaction in history\n\nRequirements: 7.1, 7.2, 7.3", "operationId": "record_transaction_api_portfolios__portfolio_id__transactions_post", "parameters": [{"name": "portfolio_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Portfolio Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionCreate"}}}}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "get": {"tags": ["transactions"], "summary": "Get Transaction History", "description": "Get transaction history for a portfolio.\n\nRequirements: 7.4, 7.5", "operationId": "get_transaction_history_api_portfolios__portfolio_id__transactions_get", "parameters": [{"name": "portfolio_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Portfolio Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/TransactionResponse"}, "title": "Response Get Transaction History Api Portfolios  Portfolio Id  Transactions Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/portfolios/{portfolio_id}/valuation": {"get": {"tags": ["analytics"], "summary": "Get Portfolio Valuation", "description": "Get comprehensive p "items": {"$ref": "#/components/schemas/ReturnAttribution"}, "type": "array", "title": "Response Calculate Portfolio Attribution Api Attribution Portfolio Calculate Post"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/valuations/manual": {"post": {"tags": ["valuations"], "summary": "Create Manual Valuation", "description": "Create a new manual valuation for an illiquid asset.\n\nRequirements: 4.1, 4.2, 10.1", "operationId": "create_manual_valuation_api_valuations_manual_post", "parameters": [{"name": "user_id", "in": "query", "required": true, "schema": {"type": "string", "title": "User Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManualValuationCreate"}}}}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManualValuationResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/valuations/manual/asset/{asset_id}": {"get": {"tags": ["valuations"], "summary": "Get Asset Valuations", "description": "Get all manual valuations for a specific asset.\n\nRequirements: 4.3, 7.4", "operationId": "get_asset_valuations_api_valuations_manual_asset__asset_id__get", "parameters": [{"name": "asset_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Asset Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ManualValuationResponse"}, "title": "Response Get Asset Valuations Api Valuations Manual Asset  Asset Id  Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/valuations/manual/asset/{asset_id}/latest": {"get": {"tags": ["valuations"], "summary": "Get Latest Valuation", "description": "Get the most recent manual valuation for a specific asset.\n\nRequirements: 1.2, 4.2", "operationId": "get_latest_valuation_api_valuations_manual_asset__asset_id__latest_get", "parameters": [{"name": "asset_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Asset Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManualValuationResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/valuations/manual/{valuation_id}": {"delete": {"tags": ["valuations"], "summary": "Delete Manual Valuation", "description": "Delete a manual valuation.\n\nRequirements: 4.3", "operationId": "delete_manual_valuation_api_valuations_manual__valuation_id__delete", "parameters": [{"name": "valuation_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Valuation Id"}}], "responses": {"204": {"description": "Successful Response"}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/profiles/step1": {"post": {"tags": ["Investor Profile"], "summary": "Create Profile - Step 1: Identity & Context", "description": "**Step 1: Create investor profile with identity & context.**\n\nThis is the first step in the three-step profile creation flow. It captures the user's\nbasic context (jurisdiction, occupation, currency) and automatically infers:\n- Applicable regulatory framework (MiFID II, SEC, FCA, FINMA, etc.)\n- Risk capacity baseline using occupation and cost-of-living data\n\n### Business Logic:\n\n**Regulatory Framework Inference:**\n- Maps jurisdiction to applicable regulatory framework\n- Example: \"CH\" \u2192 \"FINMA\", \"US\" \u2192 \"SEC\", \"GB\" \u2192 \"FCA\"\n- Framework determines compliance rules applied to the profile\n\n**Risk Capacity Calculation:**\n- Uses occupation sector + jurisdiction to estimate discretionary income\n- Adjusts for cost-of-living index in the jurisdiction\n- Returns normalized score (0-100 scale)\n- Higher score = greater capacity to bear investment losses\n\n### Privacy:\n- No PII (passport, address, tax ID) is collected at this stage\n- Profile remains in \"discovery phase\" until user activates\n- Only country-level location and sector-level occupation captured\n\n### Next Steps:\nAfter successful creation, proceed to Step 2 (G-Force Calibration) using the\nreturned `profile_id`.", "operationId": "create_profile_step1_api_profiles_step1_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileStep1Request"}}}, "required": true}, "responses": {"201": {"description": "Profile created successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileStep1Response"}, "example": {"profile_id": 1, "user_id": "demo-user-1", "jurisdiction": "CH", "occupation_sector": "Technology", "base_currency": "CHF", "regulatory_framework": "FINMA", "risk_capacity_score": 65.5, "step_completed": 1, "next_step": "step2"}}}}, "400": {"description": "Invalid input data", "content": {"application/json": {"example": {"detail": "Invalid jurisdiction code"}}}}, "409": {"description": "User already has an active profile", "content": {"application/json": {"example": {"detail": "User already has an active profile"}}}}, "500": {"description": "Internal server error", "content": {"application/json": {"example": {"detail": "Failed to create profile: Database connection error"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/profiles/{profile_id}/step2": {"put": {"tags": ["Investor Profile"], "summary": "Update Profile - Step 2: G-Force Calibration", "description": "**Step 2: Update profile with G-Force calibration.**\n\nThis is the second step in the profile creation flow. It captures the user's risk\ntolerance as a numerical volatility budget rather than subjective labels like \"Low/High\".\n\n### G-Force Concept:\n\nThe \"G-Force\" is a visual metaphor for volatility tolerance, represented as the\nmaximum tolerable drawdown percentage. This provides:\n- **Quantitative Data**: Numerical value instead of subjective self-assessment\n- **Defensible Record**: Can be linked to actual portfolio risk metrics\n- **Clear Communication**: Easy to understand and visualize\n\n### Calculations:\n\n**Volatility G-Force Target:**\n- Normalized 0-100 scale derived from drawdown percentage\n- Formula: `gforce = (drawdown_pct / 80) * 100`\n- Example: 30% drawdown \u2192 37.5 G-Force\n\n**Implied Recovery Horizon:**\n- Calculated from historical recovery time data\n- Uses diversified portfolio (60/40 equity/bonds) recovery patterns\n- Drawdown ranges:\n  - 10-15%: 6-12 months recovery\n  - 15-25%: 12-18 months recovery\n  - 25-35%: 18-30 months recovery\n  - 35-50%: 30-48 months recovery\n  - 50%+: 48-72 months recovery\n\n### Risk Profile Mapping:\n- **Conservative** (drawdown \u226415%): Low volatility tolerance\n- **Moderate** (drawdown 15-30%): Medium volatility tolerance\n- **Aggressive** (drawdown 30-50%): High volatility tolerance\n- **Very Aggressive** (drawdown >50%): Very high volatility tolerance\n\n### Next Steps:\nAfter successful update, proceed to Step 3 (Themes & Knowledge) to complete the profile.", "operationId": "update_profile_step2_api_profiles__profile_id__step2_put", "parameters": [{"name": "profile_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Profile Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileStep2Request"}}}}, "responses": {"200": {"description": "Profile updated successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileStep2Response"}, "example": {"profile_id": 1, "max_tolerable_drawdown_pct": 30.0, "volatility_gforce_target": 50.0, "implied_recovery_horizon_months": 18, "step_completed": 2, "next_step": "step3"}}}}, "400": {"description": "Invalid input data", "content": {"application/json": {"example": {"detail": "Drawdown percentage must be between 5 and 80"}}}}, "404": {"description": "Profile not found", "content": {"application/json": {"example": {"detail": "Profile with ID 999 not found"}}}}, "409": {"description": "Profile already completed", "content": {"application/json": {"example": {"detail": "Profile already completed, cannot modify"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/profiles/{profile_id}/step3": {"put": {"tags": ["Investor Profile"], "summary": "Update Profile - Step 3: Themes & Knowledge", "description": "**Step 3: Update profile with themes & knowledge.**\n\nThis is the final step in the profile creation flow. It captures the user's investment\ntheme preferences and automatically:\n- Infers knowledge tier (RETAIL or EXPERT) based on theme complexity\n- Detects risk mismatches between G-Force and selected themes\n- Triggers \"Pulse Check\" warnings if mismatches are detected\n\n### Knowledge Tier Inference:\n\nThe system infers the user's knowledge and experience level from their theme selections:\n\n**RETAIL Tier Themes:**\n- Direct Equity (Stocks)\n- Exchange-Traded Funds (ETFs)\n- Fixed Income (Bonds)\n- Real Estate (REITs)\n- Cryptocurrency (Basic Buy & Hold)\n\n**EXPERT Tier Themes:**\n- Hedge Funds\n- Private Equity\n- Derivatives\n- Structured Products\n- Complex Trading Strategies\n\n**Logic:** If ANY selected theme requires EXPERT tier \u2192 User is classified as EXPERT\n\n### Risk Mismatch Detection (Behavioral Pulse Check):\n\nThe system detects mismatches between the user's G-Force setting and selected themes:\n\n**Volatility Mismatch:**\n- Low G-Force (<30) + High Volatility Theme (>40% typical volatility)\n- Example: 15% drawdown tolerance + Cryptocurrency (70% volatility)\n\n**Liquidity Mismatch:**\n- Low G-Force (<30) + Low Liquidity Theme\n- Example: Conservative profile + Private Equity (illiquid)\n\n**Complexity Mismatch:**\n- RETAIL tier + EXPERT-only theme\n- Example: Basic investor + Hedge Funds\n\n### Risk Warnings:\n\nIf mismatches are detected, the response includes `risk_warnings` array with:\n- `warning_id`: Unique identifier for acknowledgment\n- `trigger_type`: Type of mismatch detected\n- `risky_theme`: Theme that triggered the warning\n- `risk_category`: VOLATILITY, LIQUIDITY, or COMPLEXITY\n- `warning_text`: Human-readable explanation\n- `requires_acknowledgment`: Always true for mismatches\n\n### Profile Completion:\n\n- **No Warnings:** `profile_complete = true`, profile is ready to use\n- **With Warnings:** `profile_complete = false`, user must acknowledge risks via\n  `/acknowledge-risk` endpoint before profile is complete\n\n### Next Steps:\n- If `profile_complete = true`: Profile creation is complete\n- If `profile_complete = false`: Call `/acknowledge-risk` endpoint for each warning", "operationId": "update_profile_step3_api_profiles__profile_id__step3_put", "parameters": [{"name": "profile_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Profile Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileStep3Request"}}}}, "responses": {"200": {"description": "Profile updated successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileStep3Response"}, "examples": {"no_warnings": {"summary": "Profile complete without warnings", "value": {"profile_id": 1, "selected_themes": ["DIRECT_EQUITY", "ETFS", "BONDS"], "knowledge_tier": "RETAIL", "exclusion_tags": [], "financial_objectives": ["GROWTH", "INCOME"], "risk_warnings": [], "profile_complete": true, "step_completed": 3}}, "with_warnings": {"summary": "Profile with risk mismatch warnings", "value": {"profile_id": 1, "selected_themes": ["DIRECT_EQUITY", "CRYPTO_BASIC"], "knowledge_tier": "RETAIL", "exclusion_tags": [], "financial_objectives": ["GROWTH"], "risk_warnings": [{"warning_id": "warn_123", "trigger_type": "GFORCE_THEME_MISMATCH", "risky_theme": "CRYPTO_BASIC", "risk_category": "VOLATILITY", "warning_text": "Your G-Force of 20% suggests conservative risk tolerance, but Cryptocurrency typically experiences 70% volatility.", "requires_acknowledgment": true}], "profile_complete": false, "step_completed": 3}}}}}}, "400": {"description": "Invalid input data or Step 2 not completed", "content": {"application/json": {"examples": {"step2_incomplete": {"summary": "Step 2 not completed", "value": {"detail": "Step 2 must be completed before Step 3"}}, "no_themes": {"summary": "No themes selected", "value": {"detail": "At least one investment theme must be selected"}}}}}}, "404": {"description": "Profile not found", "content": {"application/json": {"example": {"detail": "Profile with ID 999 not found"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/profiles/{profile_id}/acknowledge-risk": {"post": {"tags": ["Investor Profile"], "summary": "Acknowledge Risk Warning (Pulse Check)", "description": "**Record user's acknowledgment of risk warning (Pulse Check).**\n\nThis endpoint creates a Dialectical Audit Trail (DAT) record of the user's decision\nwhen a risk mismatch is detected between their G-Force setting and selected investment themes.\n\n### Purpose:\n\nThe \"Pulse Check\" is a mandatory acknowledgment mechanism that:\n- Proves the investor was warned about specific risks\n- Captures informed consent for proceeding despite mismatches\n- Creates a defensible audit trail for regulatory compliance\n- Protects the platform from future liability claims\n\n### User Actions:\n\n**ACKNOWLEDGED_PROCEED:**\n- User understands the risk and chooses to proceed with current profile\n- Profile is marked as complete\n- Acknowledgment is permanently recorded in audit trail\n\n**ADJUSTED_PROFILE:**\n- User chooses to modify their profile to resolve the mismatch\n- Profile remains incomplete\n- User should return to Step 2 or Step 3 to adjust settings\n\n### Audit Trail:\n\nEach acknowledgment record includes:\n- **Timestamp**: Exact time of acknowledgment\n- **IP Address**: User's IP address (for audit purposes)\n- **User Agent**: Browser/device information\n- **Warning Details**: Complete text of the warning shown\n- **Risk Category**: Type of risk (VOLATILITY, LIQUIDITY, COMPLEXITY)\n- **User Action**: How the user responded\n\n### Compliance:\n\nThis audit trail satisfies regulatory requirements for:\n- MiFID II: Suitability assessment and client warnings\n- SEC: Know Your Customer (KYC) and suitability rules\n- FCA: Client categorization and appropriateness tests\n- FINMA: Client profiling and risk disclosure\n\n### Multiple Warnings:\n\nIf Step 3 returned multiple warnings, this endpoint must be called once for each\nwarning before the profile is considered complete.\n\n### Example Flow:\n\n1. User completes Step 3 with low G-Force + high-risk theme\n2. API returns `risk_warnings` array with warning details\n3. Frontend displays warning dialog with acknowledgment checkbox\n4. User checks \"I understand\" and clicks \"Proceed\"\n5. Frontend calls this endpoint with `ACKNOWLEDGED_PROCEED`\n6. Profile is marked complete and ready to use", "operationId": "acknowledge_risk_api_profiles__profile_id__acknowledge_risk_post", "parameters": [{"name": "profile_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Profile Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RiskAcknowledgmentRequest"}}}}, "responses": {"200": {"description": "Risk acknowledgment recorded successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RiskAcknowledgmentResponse"}, "example": {"acknowledgment_id": 1, "profile_id": 1, "warning_id": "warn_123", "user_action": "ACKNOWLEDGED_PROCEED", "acknowledged_at": "2024-01-15T10:30:00Z", "profile_complete": true}}}}, "400": {"description": "Invalid input data", "content": {"application/json": {"example": {"detail": "Invalid user action"}}}}, "404": {"description": "Profile not found", "content": {"application/json": {"example": {"detail": "Profile with ID 999 not found"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/profiles/{profile_id}": {"get": {"tags": ["Investor Profile"], "summary": "Get Complete Investor Profile", "description": "**Get complete investor profile by ID.**\n\nRetrieves all profile attributes including:\n- Identity & context (jurisdiction, occupation, currency)\n- Risk calibration (G-Force, drawdown tolerance, recovery horizon)\n- Knowledge & themes (selected themes, knowledge tier, exclusions)\n- Inferred attributes (regulatory framework, risk capacity)\n- Compliance metadata (version, completion status, privacy flags)\n\n### Use Cases:\n\n- Display profile summary to user\n- Pre-fill profile edit forms\n- Validate profile completeness before portfolio operations\n- Audit profile state for compliance\n\n### Profile States:\n\n**Incomplete Profile:**\n- `completed_at` is null\n- One or more steps not yet completed\n- Cannot be used for portfolio construction\n\n**Complete Profile:**\n- `completed_at` has timestamp\n- All three steps completed\n- All risk warnings acknowledged (if any)\n- Ready for portfolio construction\n\n**Discovery Phase:**\n- `is_discovery_phase` is true\n- No PII collected yet\n- User can explore platform anonymously\n\n**Activation Phase:**\n- `is_discovery_phase` is false\n- `pii_collected_at` has timestamp\n- User has provided KYC information for transactions\n\n### Inferred Attributes:\n\n**Regulatory Framework:**\n- Automatically assigned based on jurisdiction\n- Determines compliance rules applied to profile\n\n**Risk Capacity Score:**\n- Calculated from occupation + jurisdiction + cost-of-living\n- 0-100 scale (higher = greater capacity to bear losses)\n- Methodology documented in `risk_capacity_methodology` field\n\n**Knowledge Tier:**\n- Inferred from selected investment themes\n- RETAIL: Basic themes (stocks, ETFs, bonds)\n- EXPERT: Complex themes (hedge funds, derivatives, private equity)", "operationId": "get_profile_api_profiles__profile_id__get", "parameters": [{"name": "profile_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Profile Id"}}], "responses": {"200": {"description": "Profile retrieved successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InvestorProfileSchema"}, "example": {"id": 1, "user_id": "demo-user-1", "jurisdiction": "CH", "occupation_sector": "Technology", "base_currency": "CHF", "regulatory_framework": "FINMA", "max_tolerable_drawdown_pct": 30.0, "volatility_gforce_target": 37.5, "implied_recovery_horizon_months": 18, "selected_themes": ["DIRECT_EQUITY", "ETFS", "BONDS"], "knowledge_tier": "RETAIL", "exclusion_tags": ["CRYPTO"], "financial_objectives": ["GROWTH", "INCOME"], "risk_capacity_score": 65.5, "risk_capacity_methodology": "Based on Technology median income in CH, adjusted for cost of living", "profile_version": 1, "completed_at": "2024-01-15T10:30:00Z", "is_discovery_phase": true, "created_at": "2024-01-15T10:00:00Z", "updated_at": "2024-01-15T10:30:00Z"}}}}, "404": {"description": "Profile not found", "content": {"application/json": {"example": {"detail": "Profile with ID 999 not found"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "delete": {"tags": ["Investor Profile"], "summary": "Delete Investor Profile", "description": "**Delete an investor profile by ID.**\n\nPermanently deletes the profile and all related records due to cascade deletion rules.\n\n### Cascade Deletion:\n\nDeleting a profile will automatically delete:\n- All risk acknowledgment records\n- All audit trail entries\n- Any other related data with foreign key constraints\n\n### Warning:\n\nThis operation is **irreversible**. Once deleted, the profile and all associated\ndata cannot be recovered.\n\n### Use Cases:\n\n- User requests account deletion (GDPR \"right to be forgotten\")\n- Test data cleanup\n- Profile reset (user wants to start over)\n\n### Compliance Considerations:\n\n**Data Retention:**\n- Some jurisdictions require retaining audit trails for a period after deletion\n- Consider soft-delete or archival instead of hard delete for compliance\n- Consult legal team before implementing in production\n\n**GDPR Compliance:**\n- Satisfies \"right to erasure\" requirements\n- Ensure all related data is also deleted\n- Document deletion in separate audit log\n\n### Alternative Approaches:\n\nInstead of hard deletion, consider:\n- **Soft Delete**: Mark profile as deleted but retain data\n- **Archival**: Move profile to archive table for compliance\n- **Anonymization**: Remove PII but retain anonymized data for analytics", "operationId": "delete_profile_api_profiles__profile_id__delete", "parameters": [{"name": "profile_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Profile Id"}}], "responses": {"204": {"description": "Profile deleted successfully"}, "404": {"description": "Profile not found", "content": {"application/json": {"example": {"detail": "Profile with ID 999 not found"}}}}, "500": {"description": "Internal server error", "content": {"application/json": {"example": {"detail": "Failed to delete profile: Database error"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/profiles/{profile_id}/audit": {"get": {"tags": ["Investor Profile"], "summary": "Get Compliance Audit Report", "description": "**Get compliance audit report for a profile.**\n\nGenerates a comprehensive audit report that documents the complete suitability\nassessment process and provides evidence of regulatory compliance.\n\n### Report Contents:\n\n**Profile Summary:**\n- Key profile attributes (jurisdiction, framework, knowledge tier, G-Force)\n- Completion status and timestamps\n- Current profile version\n\n**Inference Methodology:**\n- Documentation of how each inferred attribute was calculated\n- Regulatory framework mapping logic\n- Risk capacity calculation methodology\n- Knowledge tier inference rules\n- Recovery horizon calculation formula\n\n**Risk Acknowledgments (Dialectical Audit Trail):**\n- Complete list of all risk warnings shown to user\n- User's response to each warning (proceed or adjust)\n- Timestamps and IP addresses for audit purposes\n- Exact warning text displayed to user\n\n**Compliance Status:**\n- Profile completeness validation\n- Warning acknowledgment status\n- Suitability assessment completion\n- Audit trail completeness\n\n### Regulatory Use Cases:\n\n**MiFID II Compliance:**\n- Demonstrates suitability assessment process\n- Documents client warnings and responses\n- Proves informed consent for risky investments\n\n**SEC Compliance:**\n- Satisfies Know Your Customer (KYC) requirements\n- Documents suitability determination\n- Provides evidence of risk disclosure\n\n**FCA Compliance:**\n- Demonstrates appropriateness test\n- Documents client categorization\n- Proves adequate risk warnings\n\n**FINMA Compliance:**\n- Documents client profiling process\n- Proves risk disclosure and acknowledgment\n- Satisfies suitability assessment requirements\n\n### Audit Trail Integrity:\n\nAll acknowledgment records include:\n- Immutable timestamps (cannot be modified after creation)\n- IP addresses for geographic verification\n- User agent strings for device verification\n- Complete warning text (exact wording shown to user)\n- User action (proceed or adjust)\n\n### Use Cases:\n\n- Internal compliance reviews\n- External regulatory audits\n- Dispute resolution (prove user was warned)\n- Quality assurance and process improvement\n- Training and documentation", "operationId": "get_audit_report_api_profiles__profile_id__audit_get", "parameters": [{"name": "profile_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Profile Id"}}], "responses": {"200": {"description": "Audit report generated successfully", "content": {"application/json": {"schema": {}, "example": {"profile_id": 1, "user_id": "demo-user-1", "profile_summary": {"jurisdiction": "CH", "regulatory_framework": "FINMA", "knowledge_tier": "RETAIL", "gforce_target": 37.5, "completed_at": "2024-01-15T10:30:00Z"}, "inference_methodology": {"regulatory_framework": "Mapped from jurisdiction CH to FINMA framework", "risk_capacity": "Based on Technology median income in CH, adjusted for cost of living", "knowledge_tier": "Inferred from selected themes: DIRECT_EQUITY, ETFS, BONDS", "recovery_horizon": "Calculated from 30% drawdown using historical recovery data"}, "risk_acknowledgments": [{"id": 1, "trigger_type": "GFORCE_THEME_MISMATCH", "risky_theme": "CRYPTO_BASIC", "risk_category": "VOLATILITY", "warning_text": "Your G-Force of 20% suggests conservative risk tolerance...", "user_action": "ACKNOWLEDGED_PROCEED", "acknowledged_at": "2024-01-15T10:25:00Z", "ip_address": "192.168.1.1"}], "compliance_status": {"profile_complete": true, "all_warnings_acknowledged": true, "suitability_assessment_complete": true, "audit_trail_complete": true}, "generated_at": "2024-01-15T11:00:00Z"}}}}, "404": {"description": "Profile not found", "content": {"application/json": {"example": {"detail": "Profile with ID 999 not found"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/profiles/user/{user_id}": {"get": {"tags": ["Investor Profile"], "summary": "Get Profile by User ID", "description": "**Get investor profile by user ID.**\n\nRetrieves the profile associated with a specific user. Each user can have only\none active profile at a time.\n\n### Use Cases:\n\n- Check if user has completed profile creation\n- Retrieve profile for authenticated user (from JWT token)\n- Display profile in user dashboard\n- Validate profile before portfolio operations\n\n### Authentication:\n\nIn production, the `user_id` should be extracted from the JWT token rather than\npassed as a path parameter. This prevents users from accessing other users' profiles.\n\n### Profile Lookup:\n\n- Returns the most recent profile for the user\n- If user has no profile, returns 404\n- If user has multiple profiles (shouldn't happen), returns the latest\n\n### Response:\n\nSame as GET `/profiles/{profile_id}` - includes all profile attributes.", "operationId": "get_profile_by_user_id_api_profiles_user__user_id__get", "parameters": [{"name": "user_id", "in": "path", "required": true, "schema": {"type": "string", "title": "User Id"}}], "responses": {"200": {"description": "Profile retrieved successfully", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InvestorProfileSchema"}, "example": {"id": 1, "user_id": "demo-user-1", "jurisdiction": "CH", "occupation_sector": "Technology", "base_currency": "CHF", "regulatory_framework": "FINMA", "max_tolerable_drawdown_pct": 30.0, "volatility_gforce_target": 37.5, "implied_recovery_horizon_months": 18, "selected_themes": ["DIRECT_EQUITY", "ETFS"], "knowledge_tier": "RETAIL", "risk_capacity_score": 65.5, "completed_at": "2024-01-15T10:30:00Z"}}}}, "404": {"description": "Profile not found for this user", "content": {"application/json": {"example": {"detail": "No profile found for user demo-user-999"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "delete": {"tags": ["Investor Profile"], "summary": "Delete Profile by User ID", "description": "**Delete an investor profile by user ID.**\n\nPermanently deletes the profile associated with the specified user and all\nrelated records due to cascade deletion rules.\n\n### Use Cases:\n\n- User requests account deletion\n- Delete profile for authenticated user (from JWT token)\n- Test data cleanup\n\n### Authentication:\n\nIn production, the `user_id` should be extracted from the JWT token rather than\npassed as a path parameter. This prevents users from deleting other users' profiles.\n\n### Cascade Deletion:\n\nSame as DELETE `/profiles/{profile_id}` - deletes all related records.\n\n### Warning:\n\nThis operation is **irreversible**. See DELETE `/profiles/{profile_id}` for\ndetailed information about cascade deletion and compliance considerations.", "operationId": "delete_profile_by_user_id_api_profiles_user__user_id__delete", "parameters": [{"name": "user_id", "in": "path", "required": true, "schema": {"type": "string", "title": "User Id"}}], "responses": {"204": {"description": "Profile deleted successfully"}, "404": {"description": "Profile not found for this user", "content": {"application/json": {"example": {"detail": "No profile found for user demo-user-999"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/reference/jurisdictions": {"get": {"tags": ["Reference Data"], "summary": "Get Supported Jurisdictions", "description": "**Get list of supported jurisdictions with regulatory frameworks.**\n\nReturns a list of countries (jurisdictions) that are supported by the system,\nalong with their applicable regulatory frameworks.\n\n### Regulatory Frameworks:\n\n**FINMA** (Swiss Financial Market Supervisory Authority):\n- Applies to: Switzerland (CH)\n- Key requirements: Client profiling, suitability assessment, risk disclosure\n\n**SEC** (Securities and Exchange Commission):\n- Applies to: United States (US)\n- Key requirements: Know Your Customer (KYC), suitability determination\n\n**FCA** (Financial Conduct Authority):\n- Applies to: United Kingdom (GB)\n- Key requirements: Client categorization, appropriateness test\n\n**MiFID II** (Markets in Financial Instruments Directive II):\n- Applies to: EU countries (DE, FR, IT, ES, NL, BE, AT, etc.)\n- Key requirements: Suitability assessment, client categorization, product governance\n\n### Usage:\n\nUse this endpoint to populate the jurisdiction dropdown in Step 1 of profile creation.\nDisplay country names with flags for better UX.\n\n### Caching:\n\nThis data changes infrequently (only when new jurisdictions are added).\n**Recommended cache duration: 24 hours**\n\n### Response Format:\n\nEach jurisdiction includes:\n- `code`: ISO 3166-1 alpha-2 country code (e.g., \"CH\", \"US\")\n- `name`: Human-readable country name\n- `regulatory_framework`: Applicable regulatory framework code", "operationId": "get_jurisdictions_api_reference_jurisdictions_get", "responses": {"200": {"description": "List of supported jurisdictions", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/JurisdictionSchema"}, "type": "array", "title": "Response Get Jurisdictions Api Reference Jurisdictions Get"}, "example": [{"code": "CH", "name": "Switzerland", "regulatory_framework": "FINMA"}, {"code": "US", "name": "United States", "regulatory_framework": "SEC"}, {"code": "GB", "name": "United Kingdom", "regulatory_framework": "FCA"}, {"code": "DE", "name": "Germany", "regulatory_framework": "MIFID_II"}]}}}}}}, "/api/reference/occupations": {"get": {"tags": ["Reference Data"], "summary": "Get Occupation Sectors", "description": "**Get list of occupation sectors.**\n\nReturns a list of occupation sectors that are used for risk capacity calculation\nin Step 1 of profile creation.\n\n### Risk Capacity Calculation:\n\nThe occupation sector is combined with jurisdiction to estimate the user's\ndiscretionary income and capacity to bear investment losses:\n\n**Formula:**\n1. Get median income for occupation in jurisdiction (USD normalized)\n2. Adjust for cost-of-living index in jurisdiction\n3. Calculate discretionary income estimate\n4. Map to 0-100 risk capacity score\n\n**Example:**\n- Technology sector in Switzerland (high income, high COL) \u2192 Score: 70\n- Retail sector in United States (medium income, medium COL) \u2192 Score: 45\n- Education sector in Germany (medium income, low COL) \u2192 Score: 55\n\n### Occupation Categories:\n\n**High Income Sectors:**\n- Technology\n- Finance\n- Legal\n- Executive/Management\n\n**Medium Income Sectors:**\n- Healthcare\n- Education\n- Government\n- Engineering\n\n**Variable Income Sectors:**\n- Self-Employed (depends on business type)\n- Retail\n- Hospitality\n- Manufacturing\n\n### Usage:\n\nUse this endpoint to populate the occupation dropdown in Step 1 of profile creation.\nConsider grouping by income level or alphabetical sorting for better UX.\n\n### Caching:\n\nThis data changes infrequently (only when new occupation sectors are added).\n**Recommended cache duration: 24 hours**\n\n### Privacy:\n\nOnly sector-level occupation is captured, not specific job titles.\nThis maintains privacy while still enabling risk capacity estimation.", "operationId": "get_occupations_api_reference_occupations_get", "responses": {"200": {"description": "List of occupation sectors", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/OccupationSchema"}, "type": "array", "title": "Response Get Occupations Api Reference Occupations Get"}, "example": [{"sector": "Technology"}, {"sector": "Finance"}, {"sector": "Healthcare"}, {"sector": "Education"}, {"sector": "Manufacturing"}, {"sector": "Retail"}, {"sector": "Government"}, {"sector": "Self-Employed"}]}}}}}}, "/api/reference/themes": {"get": {"tags": ["Reference Data"], "summary": "Get Investment Themes", "description": "**Get list of investment themes, optionally filtered by risk profile.**\n\nReturns a list of investment themes with their characteristics (volatility,\nliquidity, complexity, knowledge tier requirements).\n\n### Investment Themes:\n\n**RETAIL Tier Themes (Basic Investors):**\n- **Direct Equity**: Individual stocks (20% volatility, high liquidity)\n- **ETFs**: Exchange-traded funds (15% volatility, high liquidity)\n- **Bonds**: Fixed income securities (8% volatility, medium liquidity)\n- **Real Estate**: REITs (18% volatility, medium liquidity)\n- **Crypto Basic**: Buy & hold cryptocurrency (70% volatility, high liquidity)\n\n**EXPERT Tier Themes (Sophisticated Investors):**\n- **Hedge Funds**: Alternative investment funds (25% volatility, low liquidity)\n- **Private Equity**: Private company investments (30% volatility, low liquidity)\n- **Derivatives**: Options, futures, swaps (40% volatility, high liquidity)\n- **Structured Products**: Complex financial instruments (35% volatility, low liquidity)\n\n### Query Parameters:\n\n**max_tolerable_drawdown_pct** (optional):\n- Filter themes suitable for the given risk tolerance\n- Based on volatility alignment with drawdown tolerance\n- Risk profile mapping:\n  - Conservative (\u226415%): Returns themes with volatility \u226420%\n  - Moderate (15-30%): Returns themes with volatility \u226435%\n  - Aggressive (30-50%): Returns themes with volatility \u226460%\n  - Very Aggressive (>50%): Returns all themes\n\n**knowledge_tier** (optional):\n- Filter by knowledge tier: \"RETAIL\" or \"EXPERT\"\n- Can be combined with risk filtering\n\n### Usage Examples:\n\n**Get all themes:**\n```\nGET /api/reference/themes\n```\n\n**Get themes suitable for conservative investor (15% drawdown):**\n```\nGET /api/reference/themes?max_tolerable_drawdown_pct=15\n```\nReturns: BONDS, ETFS (low volatility themes)\n\n**Get retail themes for moderate investor (25% drawdown):**\n```\nGET /api/reference/themes?max_tolerable_drawdown_pct=25&knowledge_tier=RETAIL\n```\nReturns: BONDS, ETFS, DIRECT_EQUITY, REAL_ESTATE\n\n**Get expert themes only:**\n```\nGET /api/reference/themes?knowledge_tier=EXPERT\n```\nReturns: HEDGE_FUNDS, PRIVATE_EQUITY, DERIVATIVES, STRUCTURED_PRODUCTS\n\n### Theme Attributes:\n\n**typical_volatility_pct:**\n- Historical average volatility (annualized standard deviation)\n- Used for risk mismatch detection\n\n**liquidity_profile:**\n- HIGH: Can be sold quickly (stocks, ETFs, crypto)\n- MEDIUM: May take days to sell (bonds, REITs)\n- LOW: May take months to exit (hedge funds, private equity)\n\n**complexity_score:**\n- 1-10 scale indicating investment complexity\n- 1-3: Simple (stocks, ETFs, bonds)\n- 4-6: Moderate (REITs, crypto, commodities)\n- 7-10: Complex (hedge funds, derivatives, structured products)\n\n### Caching:\n\nThis data changes infrequently (only when new themes are added).\n**Recommended cache duration: 24 hours**\n\n### Use in Profile Creation:\n\nIn Step 3, display themes as selectable cards with:\n- Theme name and icon\n- Volatility and liquidity indicators\n- Knowledge tier badge (RETAIL/EXPERT)\n- Complexity score visualization\n\nFilter themes based on user's G-Force from Step 2 to show only suitable options.", "operationId": "get_themes_api_reference_themes_get", "parameters": [{"name": "max_tolerable_drawdown_pct", "in": "query", "required": false, "schema": {"type": "number", "title": "Max Tolerable Drawdown Pct"}}, {"name": "knowledge_tier", "in": "query", "required": false, "schema": {"type": "string", "title": "Knowledge Tier"}}], "responses": {"200": {"description": "List of investment themes", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/InvestmentThemeSchema"}, "title": "Response ss Franc): Swiss currency, safe haven asset\n- **JPY** (Japanese Yen): Asian major currency, carry trade currency\n\n### Base Currency Purpose:\n\nThe base currency is used for:\n- Portfolio valuation and reporting\n- Performance calculation\n- Risk metrics calculation\n- FX impact attribution\n\n### Currency Selection Guidelines:\n\nUsers should select their base currency based on:\n- **Primary spending currency**: Where they live and spend money\n- **Reporting preference**: Currency they think in for investments\n- **Tax reporting**: Currency required for tax filings\n\n### Multi-Currency Support:\n\nWhile the base currency is set at profile creation, the portfolio system supports:\n- Holdings in any currency\n- Automatic FX conversion for valuation\n- FX impact attribution in performance reports\n- Multi-currency transaction tracking\n\n### Usage:\n\nUse this endpoint to populate the currency dropdown in Step 1 of profile creation.\nDisplay currency symbols and names for better UX.\n\n### Caching:\n\nThis data is static and never changes.\n**Recommended cache duration: Indefinite (or 7 days)**\n\n### Future Enhancements:\n\nAdditional currencies may be added in future releases:\n- CAD (Canadian Dollar)\n- AUD (Australian Dollar)\n- CNY (Chinese Yuan)\n- HKD (Hong Kong Dollar)\n- SGD (Singapore Dollar)", "operationId": "get_currencies_api_reference_currencies_get", "responses": {"200": {"description": "List of supported currencies", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/CurrencySchema"}, "type": "array", "title": "Response Get Currencies Api Reference Currencies Get"}, "example": [{"code": "USD", "name": "US Dollar", "symbol": "$"}, {"code": "EUR", "name": "Euro", "symbol": "\u20ac"}, {"code": "GBP", "name": "British Pound", "symbol": "\u00a3"}, {"code": "CHF", "name": "Swiss Franc", "symbol": "CHF"}, {"code": "JPY", "name": "Japanese Yen", "symbol": "\u00a5"}]}}}}}}, "/": {"get": {"summary": "Root", "operationId": "ro
